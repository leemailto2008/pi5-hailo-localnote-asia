# 系統 log 存到 SD 卡（有上限）——**尚未安裝，等 Andrew 決定**（11-24 早報待決 6）。
# 為什麼：11-23 16:2x .228 Wi-Fi 斷了 17 小時、系統一直在跑，但這台的 journal 只在記憶體（/var/log/journal 是空的），
#         Andrew 強制斷電重開後上一次開機的 NetworkManager／wlan log 全沒了，斷線根因查不到。
# 代價：一般一天寫幾 MB 文字 log（不含錄音；CLAUDE.md 重點三「零磁碟寫入」指的是錄音檔）。上限 64 MB、單檔 8 MB、保留 14 天。
# Install（.228 先試）：
#   sudo mkdir -p /etc/systemd/journald.conf.d /var/log/journal
#   sudo cp deploy/journald.conf.d/50-localnote-persistent.conf /etc/systemd/journald.conf.d/
#   sudo systemd-tmpfiles --create --prefix /var/log/journal && sudo systemctl restart systemd-journald
#   驗證：重開一次後 `journalctl --list-boots` 要看得到上一次開機。
# Uninstall：sudo rm /etc/systemd/journald.conf.d/50-localnote-persistent.conf && sudo systemctl restart systemd-journald
[Journal]
Storage=persistent
SystemMaxUse=64M
SystemMaxFileSize=8M
MaxRetentionSec=14day
